<body><div id="stage"><canvas id="scene" role="img" aria-label="Маркетолог оформляет карточку товара, запускает рекламу и следит за ростом продаж"></canvas><p id="fallback" hidden>Для 3D-анимации требуется браузер с поддержкой WebGL.</p></div>
<script src="three.r160.js"></script>
<script>/* Madrocks agency: процедурная изометрическая сцена в стиле анимации «Товар в деле».
   Цикл 24 с: карточка товара → реклама → рост продаж → аналитика. Единицы — метры. */
(() => {
'use strict';
const T=THREE,canvas=document.querySelector('#scene'),stage=document.querySelector('#stage');
let renderer;try{renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true})}catch(e){document.querySelector('#fallback').hidden=false;throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;
const scene=new T.Scene(),camera=new T.OrthographicCamera(-7,7,5,-5,.1,80);camera.position.set(10,11,14);camera.lookAt(0,.6,0);
// Палитра та же, что у сцены склада.
const C={blue:0x225bf1,dark:0x244a9c,navy:0x223760,white:0xfafcff,pale:0xe7edf8,edge:0xcbd7ee,skin:0xedc4a5,box:0xd9e3f3,sky:0x7fb0ff};
const mats={};Object.entries(C).forEach(([k,c])=>mats[k]=new T.MeshStandardMaterial({color:c,roughness:.63}));
const floorMat=new T.MeshStandardMaterial({color:0xf7f9fd,roughness:.9});
scene.add(new T.HemisphereLight(0xe5efff,0xa0aac5,2.1));
const sun=new T.DirectionalLight(0xfff8ec,4);sun.position.set(-3,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:7,bottom:-7});sun.shadow.normalBias=.025;sun.shadow.bias=-.00015;sun.shadow.radius=4;scene.add(sun);
const fill=new T.DirectionalLight(0xaec9ff,1);fill.position.set(6,4,-5);scene.add(fill);
const root=new T.Group();scene.add(root);const boxGeom=new T.BoxGeometry(1,1,1);
const smooth=x=>{x=T.MathUtils.clamp(x,0,1);return x*x*(3-2*x)},lerp=T.MathUtils.lerp,clamp=T.MathUtils.clamp,win=(t,a,b)=>smooth((t-a)/(b-a));

function box(p,w,h,d,x,y,z,mat='white'){const o=new T.Mesh(boxGeom,mats[mat]||mat);o.scale.set(w,h,d);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}
function ball(p,r,x,y,z,mat='white',sx=1,sy=1,sz=1){const o=new T.Mesh(new T.SphereGeometry(r,24,16),mats[mat]||mat);o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}
function rounded(p,w,h,d,r,x,y,z,mat){const s=new T.Shape(),a=-w/2,b=-d/2;s.moveTo(a+r,b);s.lineTo(a+w-r,b);s.quadraticCurveTo(a+w,b,a+w,b+r);s.lineTo(a+w,b+d-r);s.quadraticCurveTo(a+w,b+d,a+w-r,b+d);s.lineTo(a+r,b+d);s.quadraticCurveTo(a,b+d,a,b+d-r);s.lineTo(a,b+r);s.quadraticCurveTo(a,b,a+r,b);
 const g=new T.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelThickness:.035,bevelSize:.035,bevelSegments:3,steps:1});g.rotateX(-Math.PI/2);const m=new T.Mesh(g,mats[mat]||mat);m.position.set(x,y-h/2,z);m.castShadow=m.receiveShadow=true;p.add(m);return m}
// Вертикальная скруглённая панель (экран, телефон): толщина по Z.
function panel(p,w,h,depth,r,x,y,z,mat){const g=new T.Group();g.position.set(x,y,z);g.rotation.x=Math.PI/2;p.add(g);rounded(g,w,depth,h,r,0,0,0,mat);return g}
function canvasTex(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;tex.anisotropy=4;return{c,ctx:c.getContext('2d'),tex}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

// Платформа и пол — как у сцены склада.
rounded(root,8.6,.24,6.3,.36,0,-.17,0,'white');rounded(root,8.3,.07,6,.28,0,-.01,0,floorMat);
for(let x=-3.9;x<4;x+=.65)box(root,.009,.003,5.7,x,.033,0,'pale');for(let z=-2.8;z<2.9;z+=.65)box(root,8,.003,.009,0,.033,z,'pale');
box(root,.028,.007,4,-3.65,.04,-.2,'blue');box(root,6.5,.007,.028,-.4,.04,2.52,'blue');
for(let x=-1.4;x<2;x+=.48)box(root,.25,.005,.035,x,.04,-.45,'edge');

/* 1. Карточка товара: большой телефон на подставке */
const CARD={x:-2.3,z:-1.6},CH={x:1.75,z:-1.75};
const phone=new T.Group();phone.position.set(CARD.x,0,CARD.z);root.add(phone);
rounded(phone,1.5,.12,.72,.08,0,.06,0,'white');box(phone,1.1,.05,.08,0,.15,.22,'blue');
const tilt=new T.Group();tilt.position.set(0,.2,0);tilt.rotation.x=-.1;phone.add(tilt);
box(tilt,.12,.5,.1,0,.25,-.12,'navy');
panel(tilt,1.5,2.5,.12,.16,0,1.5,0,'navy');
const cardT=canvasTex(512,850);
const screen=new T.Mesh(new T.PlaneGeometry(1.34,2.23),new T.MeshBasicMaterial({map:cardT.tex,toneMapped:false}));screen.position.set(0,1.5,.1);tilt.add(screen);
box(tilt,.3,.035,.02,0,2.68,.06,'dark');
const HOODIE=new Path2D('M38 31C38 17 62 17 62 31L64 34L76 38C82 40 85 44 86 50L92 92L81 95L74 60V106Q74 110 70 110H30Q26 110 26 106V60L19 95L8 92L14 50C15 44 18 40 24 38L36 34Z');
const HOOD=new Path2D('M42 35C42 25 58 25 58 35L56 44C53 47 47 47 44 44Z'),POCKET=new Path2D('M35 80H65L68 97H32Z');

let cardKey='';
function drawCard(p){const key=Math.round(p*40);if(key===cardKey)return;cardKey=key;const ctx=cardT.ctx;
 ctx.fillStyle='#fafcff';ctx.fillRect(0,0,512,850);
 rr(ctx,28,26,456,46,23);ctx.fillStyle='#e7edf8';ctx.fill();ctx.fillStyle='#a9b6d0';ctx.font='26px Arial';ctx.fillText('Поиск',62,58);
 rr(ctx,28,96,456,410,18);ctx.fillStyle='#e7edf8';ctx.fill();

 if(p>.3)chip(ctx,48,118,'Хлопок 100%');if(p>.42)chip(ctx,48,184,'S – XL');if(p>.54)chip(ctx,372,438,'−20%',true);
 const n=Math.round(smooth((p-.58)/.22)*5);for(let i=0;i<5;i++){star(ctx,52+i*44,552,19);ctx.fillStyle=i<n?'#225bf1':'#d9e3f3';ctx.fill()}
 ctx.fillStyle='#223760';ctx.font='bold 30px Arial';if(n)ctx.fillText((3.6+n*.26).toFixed(1).replace('.',','),278,563);
 rr(ctx,28,598,400,22,11);ctx.fillStyle='#d9e3f3';ctx.fill();rr(ctx,28,634,290,22,11);ctx.fill();
 if(p>.8){ctx.fillStyle='#223760';ctx.font='bold 66px Arial';ctx.fillText('2 490 ₽',28,738);ctx.fillStyle='#a9b6d0';ctx.font='32px Arial';ctx.fillText('3 110 ₽',300,736);ctx.fillRect(298,724,118,3)}
 rr(ctx,28,764,456,64,14);ctx.fillStyle=p>.86?'#225bf1':'#cbd7ee';ctx.fill();ctx.fillStyle='#ffffff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('В корзину',256,807);ctx.textAlign='left';
 cardT.tex.needsUpdate=true}

// Плашки-подписи над объектами (спрайты).
function tagSprite(w,h,sw){const t=canvasTex(w,h),m=new T.SpriteMaterial({map:t.tex,transparent:true,depthWrite:false,toneMapped:false}),s=new T.Sprite(m);s.scale.set(sw,sw*h/w,1);s.renderOrder=5;root.add(s);return{s,t,key:''}}
function drawTag(tag,left,right){const k=left+right;if(k===tag.key)return;tag.key=k;const{ctx,c}=tag.t;ctx.clearRect(0,0,c.width,c.height);ctx.font='bold 40px Arial';const lw=ctx.measureText(left).width+36,w=lw+ctx.measureText(right).width+40,h=72,x=(c.width-w)/2,y=12;
 ctx.shadowColor='rgba(34,55,96,.18)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;rr(ctx,x,y,w,h,10);ctx.fillStyle='#fff';ctx.fill();ctx.shadowColor='transparent';
 ctx.save();rr(ctx,x,y,w,h,10);ctx.clip();ctx.fillStyle='#223760';ctx.fillRect(x,y,lw,h);ctx.restore();ctx.lineWidth=3;ctx.strokeStyle='#223760';rr(ctx,x,y,w,h,10);ctx.stroke();
 ctx.fillStyle='#fff';ctx.fillText(left,x+18,y+50);ctx.fillStyle='#225bf1';ctx.fillText(right,x+lw+20,y+50);tag.t.tex.needsUpdate=true}
const ctrTag=tagSprite(384,96,1.5);ctrTag.s.position.set(CARD.x+.55,3.2,CARD.z+.3);
const growTag=tagSprite(384,96,1.5);growTag.s.position.set(CH.x+.95,3.25,CH.z+.3);

/* 2. Рост продаж: столбчатая диаграмма со стрелкой */
const chart=new T.Group();chart.position.set(CH.x,0,CH.z);root.add(chart);
rounded(chart,2.5,.14,1.05,.12,0,.07,0,'white');box(chart,2.3,.012,.02,0,.15,.45,'blue');
const bars=[],H0=[.32,.42,.38,.55,.66,.8],H1=[.5,.72,.9,1.25,1.65,2.15];
H0.forEach((h,i)=>{const m=box(chart,.27,1,.42,-.95+i*.38,.14,0,i>3?'blue':'box');bars.push(m);box(chart,.29,.02,.44,-.95+i*.38,.15,0,'edge')});
const arrow=new T.Group();arrow.position.set(-1.05,.85,.34);chart.add(arrow);
const A0=new T.Vector2(0,0),A1=new T.Vector2(2.15,1.85),aLen=A0.distanceTo(A1),aAng=Math.atan2(A1.y,A1.x);
const shaftPivot=new T.Group();shaftPivot.rotation.z=aAng;arrow.add(shaftPivot);const shaft=box(shaftPivot,aLen,.075,.075,aLen/2,0,0,'navy');
const head=new T.Mesh(new T.ConeGeometry(.13,.3,4),mats.navy);head.castShadow=true;head.rotation.z=aAng-Math.PI/2;arrow.add(head);
const coins=[];for(let i=0;i<6;i++){const g=new T.Group();const c=new T.Mesh(new T.CylinderGeometry(.11,.11,.035,28),mats.blue);c.castShadow=true;g.add(c);const f=new T.Mesh(new T.CylinderGeometry(.07,.07,.037,24),mats.white);g.add(f);g.rotation.x=Math.PI/2;g.visible=false;root.add(g);coins.push(g)}

/* 3. Реклама: рупор на стойке */
const AD={x:-2.8,z:1.35};
const mega=new T.Group();mega.position.set(AD.x,0,AD.z);root.add(mega);
rounded(mega,.8,.08,.8,.3,0,.04,0,'white');box(mega,.09,1.2,.09,0,.66,0,'navy');
const btnBase=box(mega,.26,.16,.2,.2,1.0,.06,'white');const btn=ball(mega,.06,.3,1.04,.08,'blue',1,.6,1);
const target=new T.Vector3(CARD.x,1.75,CARD.z+.1),mouth0=new T.Vector3(AD.x,1.45,AD.z);
const dir=target.clone().sub(mouth0).normalize();
const horn=new T.Group();horn.position.set(0,1.45,0);horn.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);mega.add(horn);
const cone=new T.Mesh(new T.CylinderGeometry(.36,.14,.7,32,1,true),new T.MeshStandardMaterial({color:C.blue,roughness:.6,side:T.DoubleSide}));cone.castShadow=true;horn.add(cone);
const rim=new T.Mesh(new T.TorusGeometry(.36,.035,10,40),mats.white);rim.rotation.x=Math.PI/2;rim.position.y=.35;horn.add(rim);
ball(horn,.17,0,-.36,0,'navy',1,.7,1);box(horn,.07,.24,.07,0,-.22,.2,'navy');
const mouth=new T.Vector3(),ringGeo=new T.TorusGeometry(.36,.022,8,48),rings=[];
for(let i=0;i<4;i++){const r=new T.Mesh(ringGeo,new T.MeshBasicMaterial({color:0x7c9cff,transparent:true,opacity:0,depthWrite:false}));r.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),dir);root.add(r);rings.push(r)}
const fans=[];for(let i=0;i<7;i++){const s=ball(root,.065,0,0,0,i%2?'sky':'blue');s.visible=false;fans.push(s)}
// Мишень у края — «целевая аудитория».
const tgt=new T.Group();tgt.position.set(-3.45,0,-.75);root.add(tgt);box(tgt,.05,.7,.05,0,.35,0,'navy');
[[.3,'white'],[.22,'blue'],[.14,'white'],[.06,'blue']].forEach(([r,m],i)=>{const d=new T.Mesh(new T.CylinderGeometry(r,r,.03,32),mats[m]);d.rotation.x=Math.PI/2;d.rotation.z=.0;d.position.set(0,.98,.02+i*.012);d.castShadow=true;tgt.add(d)});
tgt.rotation.y=.55;
// Заказы: коробки у диаграммы.
[[3.45,-.25,0,.42,'box'],[3.45,-.25,.34,.36,'blue'],[3.0,.2,0,.38,'box'],[3.55,.3,0,.34,'pale']].forEach(([x,z,y,sz,m],i)=>{const g=new T.Group();g.position.set(x,y+sz*.4+.04,z);g.rotation.y=i*.35;root.add(g);box(g,sz,sz*.8,sz,0,0,0,m);box(g,sz*.18,.006,sz+.008,0,sz*.4+.004,0,m==='blue'?'white':'blue')});

/* 4. Аналитика: стол с монитором */
const DK={x:2.15,z:1.45};
const desk=new T.Group();desk.position.set(DK.x,0,DK.z);root.add(desk);
rounded(desk,2.1,.09,.95,.04,0,1.08,0,'pale');
[-.97,.97].forEach(x=>[-.4,.4].forEach(z=>{box(desk,.065,1.02,.065,x,.55,z,'blue');box(desk,.13,.05,.13,x,.07,z,'navy')}));
box(desk,1.98,.06,.82,0,.36,0,'edge');box(desk,2.12,.09,.06,0,.96,.44,'blue');
for(let i=0;i<3;i++)rounded(desk,.55,.11,.42,.03,-.55+i*.03,.47+i*.12,0,i===1?'blue':'box');
box(desk,.07,.42,.07,0,1.32,-.3,'navy');rounded(desk,.42,.03,.26,.04,0,1.14,-.3,'navy');
panel(desk,1.36,.8,.075,.04,0,1.78,-.34,'navy');
const monT=canvasTex(512,288);
const mon=new T.Mesh(new T.PlaneGeometry(1.26,.71),new T.MeshBasicMaterial({map:monT.tex,toneMapped:false}));mon.position.set(0,1.78,-.262);desk.add(mon);
rounded(desk,.66,.045,.23,.025,-.1,1.153,.1,'navy');for(let r=0;r<3;r++)for(let c=0;c<10;c++)box(desk,.041,.007,.041,-.365+c*.057,1.181,.025+r*.063,'pale');
rounded(desk,.13,.035,.2,.05,.42,1.15,.12,'white');
const mug=new T.Mesh(new T.CylinderGeometry(.07,.065,.17,20),mats.white);mug.position.set(-.78,1.21,.08);mug.castShadow=true;desk.add(mug);const handle=new T.Mesh(new T.TorusGeometry(.045,.014,8,16),mats.white);handle.position.set(-.71,1.21,.08);desk.add(handle);

const arcs=[[0,4.2,'blue'],[4.2,1.3,'sky'],[5.5,.78,'navy']].map(([st,len,m])=>{const g=new T.Mesh(new T.TorusGeometry(.15,.05,10,40,len),mats[m]);g.rotation.x=-Math.PI/2;g.rotation.z=st;g.position.y=.04;g.castShadow=true;pie.add(g);return g});
const LINE=[.18,.22,.2,.3,.34,.31,.45,.52,.5,.63,.72,.86];
let monKey='';

 ctx.fillStyle='#223760';ctx.fillRect(0,0,512,288);ctx.fillStyle='#b5c6ea';ctx.font='bold 28px Arial';ctx.fillText('Продажи · 30 дней',26,46);
 ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(26,92+i*44);ctx.lineTo(486,92+i*44);ctx.stroke()}
 const X=i=>26+i*(460/(LINE.length-1)),Y=v=>256-v*170,last=q*(LINE.length-1);
 if(q>0){ctx.beginPath();ctx.moveTo(X(0),256);for(let i=0;i<=last;i++)ctx.lineTo(X(i),Y(LINE[i]));const fi=Math.floor(last),fr=last-fi;let ex=X(fi),ey=Y(LINE[fi]);if(fi<LINE.length-1){ex=lerp(X(fi),X(fi+1),fr);ey=lerp(Y(LINE[fi]),Y(LINE[fi+1]),fr);ctx.lineTo(ex,ey)}
  ctx.lineTo(ex,256);ctx.closePath();ctx.fillStyle='rgba(60,120,255,.28)';ctx.fill();
  ctx.beginPath();ctx.moveTo(X(0),Y(LINE[0]));for(let i=1;i<=last;i++)ctx.lineTo(X(i),Y(LINE[i]));ctx.lineTo(ex,ey);ctx.strokeStyle='#6f9bff';ctx.lineWidth=9;ctx.lineJoin='round';ctx.stroke();
  ctx.beginPath();ctx.arc(ex,ey,9,0,7);ctx.fillStyle='#fff';ctx.fill()}
 if(fresh>0){ctx.globalAlpha=fresh;rr(ctx,356,14,132,46,8);ctx.fillStyle='#225bf1';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.fillText('+38%',372,48);ctx.globalAlpha=1}
 monT.tex.needsUpdate=true}

/* Маркетолог: тот же круглый «игрушечный» персонаж; на кепке «M» из знака Madrocks */
const worker=new T.Group();root.add(worker);const body=new T.Group();worker.add(body);
rounded(body,.48,.6,.29,.11,0,1.03,0,'blue');box(body,.34,.045,.021,0,1.15,.166,'white');box(body,.1,.12,.025,.13,.99,.16,'pale');
ball(body,.13,0,1.37,0,'skin',.6,1,.65);ball(body,.205,0,1.57,.015,'skin',.91,1.1,.93);ball(body,.21,0,1.66,-.015,'navy',.94,.7,.94);
ball(body,.045,-.19,1.56,.02,'skin');ball(body,.045,.19,1.56,.02,'skin');ball(body,.04,0,1.55,.192,'skin',.8,1,1);[-.065,.065].forEach(x=>ball(body,.015,x,1.61,.19,'navy'));
const cap=new T.Group();cap.position.set(0,1.69,.005);body.add(cap);
const crown=new T.Mesh(new T.SphereGeometry(.224,32,20,0,Math.PI*2,0,Math.PI/2),mats.blue);crown.scale.set(1,.88,1);crown.castShadow=true;cap.add(crown);
rounded(cap,.43,.03,.32,.13,0,.003,.205,'blue');ball(cap,.022,0,.2,0,'blue');
const lc=document.createElement('canvas');lc.width=lc.height=256;const lx=lc.getContext('2d');lx.strokeStyle='#fff';lx.lineWidth=20;lx.lineJoin=lx.lineCap='round';lx.beginPath();[[8,27],[13,13],[20,23],[27,12],[31,27]].forEach(([x,y],i)=>lx[i?'lineTo':'moveTo'](70+(x-8)*5,62+(y-12)*6));lx.stroke();
const logoTex=new T.CanvasTexture(lc);logoTex.colorSpace=T.SRGBColorSpace;const capLogo=new T.Mesh(new T.SphereGeometry(.227,24,12,Math.PI/2-.42,.84,.62,.62),new T.MeshBasicMaterial({map:logoTex,transparent:true,depthWrite:false}));capLogo.scale.y=.88;cap.add(capLogo);
function limb(x,y,ul,ll,arm){const a=new T.Group();a.position.set(x,y,0);body.add(a);const m=arm?'blue':'navy';ball(a,arm?.1:.115,0,0,0,m);rounded(a,arm?.15:.17,ul,arm?.17:.19,.055,0,-ul/2,0,m);
 const b=new T.Group();b.position.y=-ul;a.add(b);ball(b,.075,0,0,0,arm?'skin':'navy');rounded(b,arm?.115:.145,ll,arm?.13:.17,.05,0,-ll/2,0,arm?'skin':'navy');
 if(arm)ball(b,.079,0,-ll,.005,'skin',.8,1,1);else rounded(b,.19,.11,.32,.06,0,-ll,.06,'white');return{a,b}}

/* Сценарий: 24 с, все позы считаются от времени — цикл без швов */
const LOOP=24,P={home:[.45,.95],card:[CARD.x+.1,-.78],ad:[-1.98,1.55],desk:[DK.x,2.6]};

 let moving=0,angle;
 if(walk){const u=(t-walk.s)/(walk.e-walk.s);moving=Math.sin(Math.PI*u);const ah=positionAt(Math.min(t+.03,walk.e)),bh=positionAt(Math.max(t-.03,walk.s));angle=Math.atan2(ah[0]-bh[0],ah[1]-bh[1]);angle=nearestAngle(FACE[walk.from],angle,smooth(u/.16));angle=nearestAngle(angle,FACE[walk.to],smooth((u-.82)/.18))}

 const gait=Math.sin(t*9),gait2=Math.cos(t*9);body.position.y=Math.abs(gait2)*.035*moving;body.rotation.set(.04*moving,0,gait*.035*moving);

 // 9.2–12 с: жмёт кнопку на стойке рупора.
 const atAd=win(t,9.1,9.5)*(1-win(t,11.7,12));let press=0;
 if(atAd>0){press=Math.max(0,Math.sin((t-9.3)*Math.PI/.55))*(t<10.4?1:0);armR.a.rotation.x=lerp(armR.a.rotation.x,-1.05-.25*press,atAd);armR.b.rotation.x=lerp(-.12,-.55+.2*press,atAd);armR.a.rotation.z=-.07+.18*atAd;armL.a.rotation.x=lerp(armL.a.rotation.x,-.15,atAd);body.rotation.x=.05*atAd}

 // 14.6–20 с: аналитика за столом — печатает, сверяет график.
 const atDesk=win(t,14.5,15)*(1-win(t,19.7,20.1));
 if(atDesk>0){const k=Math.sin(t*22),k2=Math.cos(t*19);armL.a.rotation.x=lerp(armL.a.rotation.x,-.92+.05*k,atDesk);armR.a.rotation.x=lerp(armR.a.rotation.x,-.92+.05*k2,atDesk);armL.b.rotation.x=armR.b.rotation.x=lerp(-.12,-.62,atDesk);armL.a.rotation.z=.07+.12*atDesk;armR.a.rotation.z=-.07-.12*atDesk;body.rotation.x=.08*atDesk+.015*Math.sin(t*3)}
 // Дома — с планшетом.
 const atHome=1-win(t,.05,.5)*(1-win(t,22.3,22.9));
 if(atHome>0.01){tablet.visible=true;tablet.scale.setScalar(atHome);armL.a.rotation.x=lerp(armL.a.rotation.x,-.75,atHome);armR.a.rotation.x=lerp(armR.a.rotation.x,-.75,atHome);armL.b.rotation.x=armR.b.rotation.x=lerp(-.12,-.75,atHome);armL.a.rotation.z=lerp(.07,-.2,atHome);armR.a.rotation.z=lerp(-.07,.2,atHome)}
 // Сброс сцены 22.2–23.8 с.

 rings.forEach((r,i)=>{const s=9.5+i*.7,u=(t-s)/1.4;if(u<0||u>1){r.material.opacity=0;r.visible=false;return}r.visible=true;r.position.copy(mouth).addScaledVector(dir,u*1.1);r.scale.setScalar(1+u*1.3);r.material.opacity=(1-u)*.85});
 const scr=new T.Vector3(CARD.x,1.75,CARD.z+.12);let arrived=0;
 fans.forEach((f,i)=>{const s=9.8+i*.36,u=(t-s)/1.3;if(u>=1)arrived++;if(u<0||u>1){f.visible=false;return}f.visible=true;const e=v3.set(scr.x+(i%3-1)*.35,scr.y+(i%2?.35:-.25),scr.z);f.position.lerpVectors(mouth,e,smooth(u));f.position.y+=Math.sin(Math.PI*u)*.55;f.scale.setScalar(u>.85?1-smooth((u-.85)/.15):smooth(u/.12))});
 const ctrShow=win(t,9.6,10.1)*(1-reset);ctrTag.s.material.opacity=ctrShow;ctrTag.s.visible=ctrShow>.01;
 drawTag(ctrTag,'CTR',(2.9+arrived*(1.9/7)).toFixed(1).replace('.',',')+'%');

 bars.forEach((b,i)=>{const g=win(t,12.9+i*.38,13.9+i*.38)*(1-win(t,22.2+i*.12,23.4+i*.12)),h=lerp(H0[i],H1[i],g);b.scale.y=h;b.position.y=.14+h/2});
 const ag=win(t,14.6,16)*(1-reset);shaft.scale.x=Math.max(aLen*ag,.001);shaft.position.x=aLen*ag/2;head.position.set(A1.x*ag,A1.y*ag,0);head.scale.setScalar(smooth(ag*3));arrow.visible=ag>.005;
 const gShow=win(t,15.6,16.1)*(1-reset);growTag.s.material.opacity=gShow;growTag.s.visible=gShow>.01;drawTag(growTag,'Продажи','+38%');growTag.s.position.y=3.25+.06*Math.sin(t*2+1);
 // Аналитика на мониторе и круговая диаграмма.
 drawMon(win(t,14.8,19)*(1-reset),win(t,18.6,19.2)*(1-reset));
 arcs.forEach((a,i)=>a.scale.setScalar(Math.max(.001,win(t,15.4+i*.6,16+i*.6)*(1-reset))));
 halo.position.set(pos[0],.048,pos[1]);halo.material.opacity=.15+.07*Math.sin(t*2);
 renderer.render(scene,camera);return{t,stop:walk?null:stopAt(t)}}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const aspect=w/h,span=Math.max(8.9,10.7/aspect);camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.updateProjectionMatrix();update(forced??clock)}
new ResizeObserver(resize).observe(stage);
