# nginx для tovarvdele.ru: статика (css, картинки, скрипты) отдаётся напрямую из public/,
# а адреса страниц (/, /kontakty/, /dokumenty/…) и /admin идут в Laravel — он подставляет настройки из админки.
# Пути и версию PHP-FPM поправить под сервер.
server {
    listen 80;
    server_name tovarvdele.ru www.tovarvdele.ru;
    root /var/www/tovarvdele/public;
    index index.php;
    charset utf-8;

    # Без $uri/ в try_files: каталог (например /kontakty/) не отдаётся как index.html, а уходит в Laravel
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Шаблоны страниц напрямую не показываем
    location ~ (^|/)index\.html$ {
        rewrite ^(.*/)index\.html$ $1 permanent;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
